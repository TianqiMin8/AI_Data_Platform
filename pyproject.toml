[project]
name = "ai-data-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Tianqi Min",email = "tmin2@dons.usfca.edu"}
]
requires-python = "^3.11"
dependencies = [
    "structlog (>=26.1.0,<27.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.4,<0.17.0)"
]
